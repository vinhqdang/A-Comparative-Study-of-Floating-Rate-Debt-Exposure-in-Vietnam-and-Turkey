              - generic [ref=f27e481]:
                - heading "Use of inclusive language" [level=4] [ref=f27e482]
                - generic [ref=f27e483]:
                  - paragraph [ref=f27e484]: "Inclusive language acknowledges diversity, conveys respect to all people, is sensitive to differences, and promotes equal opportunities. Authors should ensure their work uses inclusive language throughout and contains nothing which might imply one individual is superior to another on the grounds of:"
                  - list [ref=f27e485]:
                    - listitem [ref=f27e486]:
                      - paragraph [ref=f27e487]: age
                    - listitem [ref=f27e488]:
                      - paragraph [ref=f27e489]: gender
                    - listitem [ref=f27e490]:
