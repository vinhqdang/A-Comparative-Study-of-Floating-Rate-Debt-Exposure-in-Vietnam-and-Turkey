                    - text: .
              - generic [ref=f27e764]:
                - heading "Research data" [level=4] [ref=f27e765]
                - generic [ref=f27e767]:
                  - paragraph [ref=f27e768]:
                    - text: We are committed to supporting the storage of, access to and discovery of research data, and our
                    - link "research data policy" [ref=f27e769] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/research-data
                    - text: sets out the principles guiding how we work with the research community to support a more efficient and transparent research process.
                  - paragraph [ref=f27e770]: Research data refers to the results of observations or experimentation that validate research findings, which may also include software, code, models, algorithms, protocols, methods and other useful materials related to the project.
                  - paragraph [ref=f27e771]:
                    - text: Please read our guidelines on
                    - link "sharing research data" [ref=f27e772] [cursor=pointer]:
