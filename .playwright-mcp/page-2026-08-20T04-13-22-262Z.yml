              - generic [ref=f27e792]:
                - heading "Data linking" [level=4] [ref=f27e793]
                - generic [ref=f27e794]:
                  - paragraph [ref=f27e795]: Linking to the data underlying your work increases your exposure and may lead to new collaborations. It also provides readers with a better understanding of the described research.
                  - paragraph [ref=f27e796]: "If your research data has been made available in a data repository there are a number of ways your article can be linked directly to the dataset:"
