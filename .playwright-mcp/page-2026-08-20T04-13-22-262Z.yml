              - generic [ref=f27e418]:
                - heading "Funding sources" [level=4] [ref=f27e419]
                - generic [ref=f27e420]:
                  - paragraph [ref=f27e421]: Authors must disclose any funding sources who provided financial support for the conduct of the research and/or preparation of the article. The role of sponsors, if any, should be declared in relation to the study design, collection, analysis and interpretation of data, writing of the report and decision to submit the article for publication. If funding sources had no such involvement this should be stated in your submission.
                  - paragraph [ref=f27e422]: "List funding sources in this standard way to facilitate compliance to funder's requirements:"
