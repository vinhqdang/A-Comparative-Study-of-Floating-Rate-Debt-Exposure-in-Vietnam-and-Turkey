                  - paragraph [ref=f27e776]:
                    - text: For this journal, Option C instructions from our
                    - link "research data guidelines" [ref=f27e777] [cursor=pointer]:
                      - /url: https://www.elsevier.com/researcher/author/tools-and-resources/research-data/data-guidelines
                    - text: "apply. This means that you are required to:"
