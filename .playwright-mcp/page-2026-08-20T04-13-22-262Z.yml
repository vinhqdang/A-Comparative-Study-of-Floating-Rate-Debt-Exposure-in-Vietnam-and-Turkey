                    - text: .
              - generic [ref=f27e1019]:
                - heading "Submission fees" [level=4] [ref=f27e1020]
                - generic [ref=f27e1021]:
                  - paragraph [ref=f27e1022]: Each submission must be accompanied by a submission fee of US$ 125.00. Submissions will only be considered after payment of the submission fee during the submission process. The submission fee is non-refundable and a paper may be rejected by the editors without being sent for review. The proceeds of submission fees are used for the development of academic activities in the interest of the Journal's audience.
                  - paragraph [ref=f27e1023]: Please note that if your manuscript is transferred via our article transfer service, you will not be required to pay another submission fee. This policy is designed to facilitate the seamless continuation of your submission process across our journals.
                  - paragraph
            - generic [ref=f27e1024]:
              - heading "After receiving a final decision" [level=3] [ref=f27e1025]
              - generic [ref=f27e1026]:
                - heading "Article Transfer Service" [level=4] [ref=f27e1027]
                - generic [ref=f27e1028]:
                  - paragraph [ref=f27e1029]:
                    - text: If your manuscript is more suitable for an alternative journal published by Elsevier, you may receive an email asking you to consider transferring your manuscript via Elsevier's
                    - link "Article Transfer Service" [ref=f27e1030] [cursor=pointer]:
                      - /url: https://www.elsevier.com/researcher/author/submit-your-paper/submit-and-revise/article-transfer-service
                    - text: .
                  - paragraph [ref=f27e1031]:
                    - text: The recommendation could come from the journal editor, a dedicated
                    - link "in-house scientific managing editor" [ref=f27e1032] [cursor=pointer]:
                      - /url: https://www.elsevier.com/researcher/author/submit-your-paper/submit-and-revise/article-transfer-service/managing-editors
                    - text: ", a tool-assisted recommendation or a combination."
                  - paragraph [ref=f27e1033]: If you agree with the recommendation, your manuscript will be transferred and independently reviewed by the editors of the new journal. You will have the opportunity to make revisions, if necessary, before the submission is complete at the destination journal.
