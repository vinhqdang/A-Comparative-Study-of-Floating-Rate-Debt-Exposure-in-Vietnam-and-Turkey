                        - text: . Files should be within our preferred maximum file size of 150 MB per file, 1 GB in total.
                    - listitem [ref=f27e757]:
                      - paragraph [ref=f27e758]: Provide "stills" for each of your files. These will be used as standard icons to personalize the link to your video data. You can choose any frame from your video or animation or make a separate image.
                    - listitem [ref=f27e759]:
                      - paragraph [ref=f27e760]: Provide descriptive text in your manuscript to refer to the video content. This text helps ensure accessibility for visually impaired readers who rely on descriptive information. For journals publishing in print this is also essential, as video and animation files cannot be embedded in the print version.
