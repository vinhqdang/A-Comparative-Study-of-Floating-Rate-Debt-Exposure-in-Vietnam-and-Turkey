                    - listitem [ref=f27e492]:
                      - paragraph [ref=f27e493]: ethnicity
                    - listitem [ref=f27e494]:
                      - paragraph [ref=f27e495]: culture
                    - listitem [ref=f27e496]:
                      - paragraph [ref=f27e497]: sexual orientation
                    - listitem [ref=f27e498]:
                      - paragraph [ref=f27e499]: disability or health condition
                  - paragraph [ref=f27e500]: We recommend avoiding the use of descriptors about personal attributes unless they are relevant and valid. Write for gender neutrality with the use of plural nouns ("clinicians, patients/clients") as default. Wherever possible, avoid using "he, she," or "he/she."
                  - paragraph [ref=f27e501]: No assumptions should be made about the beliefs of readers and writing should be free from bias, stereotypes, slang, reference to dominant culture and/or cultural assumptions.
                  - paragraph [ref=f27e502]: These guidelines are meant as a point of reference to help you identify appropriate language but are by no means exhaustive or definitive.
              - generic [ref=f27e503]:
                - heading "Reporting sex- and gender-based analyses" [level=4] [ref=f27e504]
                - generic [ref=f27e505]:
                  - paragraph [ref=f27e506]: "There is no single, universally agreed-upon set of guidelines for defining sex and gender. We offer the following guidance:"
                  - list [ref=f27e507]:
                    - listitem [ref=f27e508]:
                      - paragraph [ref=f27e509]: Sex and gender-based analyses (SGBA) should be integrated into research design when research involves or pertains to humans, animals or eukaryotic cells. This should be done in accordance with any requirements set by funders or sponsors and best practices within a field.
                    - listitem [ref=f27e510]:
                      - paragraph [ref=f27e511]: Sex and/or gender dimensions of the research should be addressed within the article or declared as a limitation to the generalizability of the research.
                    - listitem [ref=f27e512]:
                      - paragraph [ref=f27e513]: Definitions of sex and/or gender applied should be explicitly stated to enhance the precision, rigor and reproducibility of the research and to avoid ambiguity or conflation of terms and the constructs to which they refer.
                  - paragraph [ref=f27e514]:
                    - text: We advise you to read the
                    - link "Sex and Gender Equity in Research (SAGER) guidelines" [ref=f27e515] [cursor=pointer]:
                      - /url: https://researchintegrityjournal.biomedcentral.com/articles/10.1186/s41073-016-0007-6/tables/1
                    - text: and the
                    - link "SAGER checklist" [ref=f27e516] [cursor=pointer]:
                      - /url: https://ease.org.uk/wp-content/uploads/2023/01/EASE-SAGER-Checklist-2022.pdf
                    - text: (PDF) on the EASE website, which offer systematic approaches to the use of sex and gender information in study design, data analysis, outcome reporting and research interpretation.
                  - paragraph [ref=f27e517]:
                    - text: For further information we suggest reading the rationale behind and recommended
                    - link "use of the SAGER guidelines" [ref=f27e518] [cursor=pointer]:
                      - /url: https://doi.org/10.1186/s41073-016-0007-6
                    - text: .
                  - heading "Definitions of sex and/or gender" [level=5] [ref=f27e519]
                  - paragraph [ref=f27e520]: "We ask authors to define how sex and gender have been used in their research and publication. Some guidance:"
                  - list [ref=f27e521]:
                    - listitem [ref=f27e522]:
                      - paragraph [ref=f27e523]: Sex generally refers to a set of biological attributes that are associated with physical and physiological features such as chromosomal genotype, hormonal levels, internal and external anatomy. A binary sex categorization (male/female) is usually designated at birth ("sex assigned at birth") and is in most cases based solely on the visible external anatomy of a newborn. In reality, sex categorizations include people who are intersex/have differences of sex development (DSD).
                    - listitem [ref=f27e524]:
                      - paragraph [ref=f27e525]: Gender generally refers to socially constructed roles, behaviors and identities of women, men and gender-diverse people that occur in a historical and cultural context and may vary across societies and over time. Gender influences how people view themselves and each other, how they behave and interact and how power is distributed in society.
                  - paragraph [ref=f27e526]: Depending on the focus of a paper, sex and/or gender may or may not be relevant to the content of the paper. We recognize that beliefs, attitudes, and laws relating to sex and gender may vary. These articles do not attempt to dictate author beliefs but rather require that, where relevant to an author’s research or paper, the author must provide clear explanations of how the paper and research define and use sex and gender.
              - generic [ref=f27e527]:
                - heading "Jurisdictional claims" [level=4] [ref=f27e528]
                - generic [ref=f27e529]:
                  - paragraph [ref=f27e530]: Elsevier respects the decisions taken by its authors as to how they choose to designate territories and identify their affiliations in their published content. Elsevier’s policy is to take a neutral position with respect to territorial disputes or jurisdictional claims, including, but not limited to, maps and institutional affiliations. For journals that Elsevier publishes on behalf of a third party owner, the owner may set its own policy on these issues.
                  - list [ref=f27e531]:
                    - listitem [ref=f27e532]:
                      - paragraph [ref=f27e533]: "Maps: Readers should be able to locate any study areas shown within maps using common mapping platforms. Maps should only show the area actually studied and authors should not include a location map which displays a larger area than the bounding box of the study area. Authors should add a note clearly stating that \"map lines delineate study areas and do not necessarily depict accepted national boundaries”. During the review process, Elsevier’s editors may request authors to change maps if these guidelines are not followed."
                    - listitem [ref=f27e534]:
                      - paragraph [ref=f27e535]: "Institutional affiliations: Authors should use either the full, standard title of their institution or the standard abbreviation of the institutional name so that the institutional name can be independently verified for research integrity purposes."
                  - paragraph
