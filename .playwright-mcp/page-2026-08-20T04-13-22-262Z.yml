                    - listitem [ref=f27e1010]:
                      - paragraph [ref=f27e1011]: For open access articles, all authors understand that they are responsible for payment of the article publishing charge (APC) if the manuscript is accepted. Payment of the APC may be covered by the corresponding author's institution, or the research funder.
                  - paragraph
              - generic [ref=f27e1012]:
                - heading "Submit online" [level=4] [ref=f27e1013]
                - generic [ref=f27e1014]:
                  - paragraph [ref=f27e1015]: Our online submission system guides you through the process steps of entering your manuscript details and uploading your files. The system converts your article files to a single PDF file used in the peer-review process.
                  - paragraph [ref=f27e1016]: Editable files (e.g., Word, LaTeX) are required to typeset your article for final publication. All correspondence, including notification of the editor's decision and requests for revision, is sent by email.
                  - paragraph [ref=f27e1017]:
                    - text: Please follow this link to
                    - link "submit your paper" [ref=f27e1018] [cursor=pointer]:
