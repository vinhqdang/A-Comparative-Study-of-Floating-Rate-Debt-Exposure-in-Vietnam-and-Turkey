                  - paragraph [ref=f27e424]: It is not necessary to include detailed descriptions on the program or type of grants, scholarships and awards. When funding is from a block grant or other resources available to a university, college, or other research institution, submit the name of the institute or organization that provided the funding.
                  - paragraph [ref=f27e425]: "If no funding has been provided for the research, it is recommended to include the following sentence:"
                  - paragraph [ref=f27e426]: This research did not receive any specific grant from funding agencies in the public, commercial, or not-for-profit sectors.
              - generic [ref=f27e427]:
                - heading "Declaration of generative AI use" [level=4] [ref=f27e428]
                - generic [ref=f27e429]:
                  - paragraph [ref=f27e430]: Authors must declare the use of generative AI tools in the manuscript preparation process upon submission of the paper.
                  - paragraph [ref=f27e431]: Generative AI and AI-assisted technologies (“AI tools”) have been rapidly adopted in research and scholarly publishing, offering significant benefits while requiring clear standards for responsible and transparent use.
                  - paragraph [ref=f27e432]: Authors preparing a manuscript for this journal may use AI tools to support them. However, these tools must never be used as a substitute for human critical thinking, expertise and evaluation. AI tools may only be applied with human oversight and control.
                  - paragraph [ref=f27e433]:
                    - text: Please read Elsevier’s detailed author policy on the use of AI tools, as stated in Elsevier’s
                    - link "generative AI policies for journals" [ref=f27e434] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
                    - text: .
                  - paragraph [ref=f27e435]: "Ultimately, authors are responsible and accountable for the contents of their work. This includes accountability for:"
                  - list [ref=f27e436]:
                    - listitem [ref=f27e437]:
                      - paragraph [ref=f27e438]: Carefully reviewing and verifying the accuracy, comprehensiveness, and impartiality of all AI-generated output (including checking the sources, as AI-generated references can be incorrect or fabricated).
                    - listitem [ref=f27e439]:
                      - paragraph [ref=f27e440]: Editing and adapting all material thoroughly to ensure the manuscript represents the author’s authentic and original contribution and reflects their own analysis, interpretation, insights and ideas.
                    - listitem [ref=f27e441]:
                      - paragraph [ref=f27e442]: Ensuring accuracy and originality of any AI generated images and provide appropriate attribution where relevant.
                    - listitem [ref=f27e443]:
                      - paragraph [ref=f27e444]: Ensuring the use of any tools or sources, AI-based or otherwise, is made clear and transparent to readers. If AI tools have been used, we require a disclosure statement upon submission; please see example below.
                    - listitem [ref=f27e445]:
                      - paragraph [ref=f27e446]: Ensuring the manuscript is developed in a way that safeguards data privacy, intellectual property and other rights, by checking the terms and conditions of any AI tool that is used.
                  - paragraph [ref=f27e447]: Finally, authors must not list or cite AI tools as an author or co-author on the manuscript since authorship implies responsibilities and tasks that can only be attributed to, and performed by, humans.
                  - paragraph [ref=f27e448]: "The use of AI tools in the manuscript preparation process must be declared by adding a statement at the end of the manuscript when the paper is first submitted. The statement will appear in the published work and should be placed in a new section before the references list. An example:"
                  - paragraph [ref=f27e449]: "Title of new section: Declaration of generative AI and AI-assisted technologies in the manuscript preparation process. Statement: During the preparation of this work the author(s) used [NAME OF TOOL / SERVICE] in order to [REASON]. After using this tool/service, the author(s) reviewed and edited the content as needed and take(s) full responsibility for the content of the published article."
                  - paragraph [ref=f27e450]: The declaration does not apply to the use of basic tools, such as tools used to check grammar, spelling and references. In addition, authors are not required to disclose the use of AI tools or features within specialist disability-related assistive technology, provided these are used solely for accessibility purposes.
                  - paragraph [ref=f27e451]: If you have nothing to disclose, you do not need to add a statement.
                  - paragraph [ref=f27e452]:
                    - text: "Please note: to protect authors’ rights and the confidentiality of their research, this journal does not currently allow academic editors and reviewers to upload an unpublished manuscript into a generative AI tool, as is stated in Elsevier’s"
                    - link "generative AI policies for journals" [ref=f27e453] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
                    - text: . However, AI tools may be used in a supportive capacity by editors and reviewers to improve structure and language of the review report or editorial decision letter or to conduct a background literature search. Elsevier is actively evaluating compliant AI tools and may revise this policy in the future.
