                    - listitem [ref=f27e798]:
                      - paragraph [ref=f27e799]: Provide a link to your dataset when prompted during the online submission process.
                    - listitem [ref=f27e800]:
                      - paragraph [ref=f27e801]: For some data repositories, a repository banner will automatically appear next to your published article on ScienceDirect.
                    - listitem [ref=f27e802]:
                      - paragraph [ref=f27e803]: "You can also link relevant data or entities within the text of your article through the use of identifiers. Use the following format: Database: 12345 (e.g. TAIR: AT1G01020; CCDC: 734053; PDB: 1XFN)."
