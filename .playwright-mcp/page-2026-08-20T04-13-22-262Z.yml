            - generic [ref=f27e298]:
              - heading "About the journal" [level=3] [ref=f27e299]
              - generic [ref=f27e300]:
                - heading "Aims and scope" [level=4] [ref=f27e301]
                - generic [ref=f27e302]:
                  - paragraph [ref=f27e303]: International trade, financing and investments, and the related cash and credit transactions, have grown at an extremely rapid pace in recent years. The international monetary system has continued to evolve to accommodate the need for foreign-currency denominated transactions and in the process has provided opportunities for its ongoing observation and study.
                  - paragraph [ref=f27e304]: The purpose of the Journal of International Financial Markets, Institutions & Money is to publish rigorous, original articles dealing with the international aspects of financial markets, institutions and money. Theoretical/conceptual and empirical papers providing meaningful insights into the subject areas will be considered. The following topic areas, although not exhaustive, are representative of the coverage in this Journal.
                  - paragraph [ref=f27e305]: • International financial markets • International securities markets • Foreign exchange markets • Eurocurrency markets • International syndications • Term structures of Eurocurrency rates • Determination of exchange rates • Information, speculation and parity • Forward rates and swaps • International payment mechanisms • International commercial banking; • International investment banking • Central bank intervention • International monetary systems • Balance of payments.
                  - paragraph
              - generic [ref=f27e306]:
                - heading "Peer review" [level=4] [ref=f27e307]
                - generic [ref=f27e308]:
                  - paragraph [ref=f27e309]:
                    - text: This journal follows a double anonymized review process. Your submission will initially be assessed by our editors. If your submission is deemed suitable, it will typically be sent to be reviewed by a minimum of two reviewers for an independent expert assessment of the scientific quality. The decision as to whether your article is accepted or rejected for publication will be made by our editors.Read more about
                    - link "peer review" [ref=f27e310] [cursor=pointer]:
                      - /url: https://www.elsevier.com/reviewer/what-is-peer-review
                    - text: .
                  - paragraph [ref=f27e311]: "Our editors are not involved in making decisions about papers which:"
                  - list [ref=f27e312]:
                    - listitem [ref=f27e313]:
                      - paragraph [ref=f27e314]: they have written themselves.
                    - listitem [ref=f27e315]:
                      - paragraph [ref=f27e316]: have been written by family members or colleagues.
                    - listitem [ref=f27e317]:
                      - paragraph [ref=f27e318]: relate to products or services in which they have an interest.
                  - paragraph [ref=f27e319]:
                    - text: Any such submissions will be subject to the journal's usual procedures and peer review will be handled independently of the editor involved and their research group. Read more about
                    - link "editor duties" [ref=f27e320] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/publishing-ethics#2-duties-of-editors
                    - text: .
                  - paragraph [ref=f27e321]:
                    - text: Authors may submit a formal appeal request to the editorial decision, provided it meets all the requirements and follows the procedure outlined in Elsevier’s
                    - link "Appeal Policy" [ref=f27e322] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/editorial-decision-appeals-policy
                    - text: . Only one appeal per submission will be considered and the appeal decision will be final.
              - generic [ref=f27e324]:
                - heading "Special issues and article collections" [level=4] [ref=f27e325]
                - paragraph [ref=f27e326]: The peer review process for special issues and article collections follows the same process as outlined above for regular submissions, except, a guest editor may send the submissions out to the reviewers and may recommend a decision to the journal editor. The journal editor oversees the peer review process of all special issues and article collections to ensure the high standards of publishing ethics and responsiveness are respected and is responsible for the final decision regarding acceptance or rejection of articles.
              - generic [ref=f27e327]:
                - heading "Open access" [level=4] [ref=f27e328]
                - generic [ref=f27e329]:
                  - paragraph [ref=f27e330]:
                    - text: We refer you to our
                    - link "open access information page" [ref=f27e331] [cursor=pointer]:
                      - /url: https://www.sciencedirect.com/science/journal/10424431/publish/open-access-options
                    - text: to learn about open access options for this journal.
                  - paragraph
              - generic [ref=f27e332]:
                - heading "Submission fees" [level=4] [ref=f27e333]
                - generic [ref=f27e334]:
                  - paragraph [ref=f27e335]: Each submission must be accompanied by a submission fee of US$ 125.00. Submissions will only be considered after payment of the submission fee during the submission process. The submission fee is non-refundable and a paper may be rejected by the editors without being sent for review. The proceeds of submission fees are used for the development of academic activities in the interest of the Journal's audience.
                  - paragraph [ref=f27e336]: Please note that if your manuscript is transferred via our article transfer service, you will not be required to pay another submission fee. This policy is designed to facilitate the seamless continuation of your submission process across our journals.
                  - paragraph
            - generic [ref=f27e337]:
              - heading "Ethics and policies" [level=3] [ref=f27e338]
              - generic [ref=f27e339]:
                - heading "Ethics in publishing" [level=4] [ref=f27e340]
                - paragraph [ref=f27e342]:
                  - text: Authors must follow ethical guidelines stated in Elsevier's
                  - link "Publishing Ethics Policy" [ref=f27e343] [cursor=pointer]:
                    - /url: https://www.elsevier.com/about/policies-and-standards/publishing-ethics#4-duties-of-authors
                  - text: .
              - generic [ref=f27e344]:
                - heading "Submission declaration" [level=4] [ref=f27e345]
                - generic [ref=f27e346]:
                  - paragraph [ref=f27e347]: "When authors submit an article to an Elsevier journal it is implied that:"
                  - list [ref=f27e348]:
                    - listitem [ref=f27e349]:
                      - paragraph [ref=f27e350]:
                        - text: The work described has not been published previously except in the form of a preprint, an abstract, a published lecture, academic thesis or registered report. See our policy on
                        - link "multiple, redundant or concurrent publication" [ref=f27e351] [cursor=pointer]:
                          - /url: https://www.elsevier.com/about/policies/publishing-ethics#Authors
                        - text: .
                    - listitem [ref=f27e352]:
                      - paragraph [ref=f27e353]: The article is not under consideration for publication elsewhere.
                    - listitem [ref=f27e354]:
                      - paragraph [ref=f27e355]: The article's publication is approved by all authors and tacitly or explicitly by the responsible authorities where the work was carried out.
                    - listitem [ref=f27e356]:
                      - paragraph [ref=f27e357]: If accepted, the article will not be published elsewhere in the same form, in English or in any other language, including electronically, without the written consent of the copyright-holder.
                  - paragraph [ref=f27e358]: To verify compliance with our journal publishing policies, we may check your manuscript with our screening tools.
              - generic [ref=f27e359]:
                - heading "Authorship" [level=4] [ref=f27e360]
                - generic [ref=f27e361]:
                  - paragraph [ref=f27e362]: "All authors should have made substantial contributions to all of the following:"
                  - list [ref=f27e363]:
                    - listitem [ref=f27e364]:
                      - paragraph [ref=f27e365]: The conception and design of the study, or acquisition of data, or analysis and interpretation of data
                    - listitem [ref=f27e366]:
                      - paragraph [ref=f27e367]: Drafting the article or revising it critically for important intellectual content.
                    - listitem [ref=f27e368]:
                      - paragraph [ref=f27e369]: Final approval of the version to be submitted.
                  - paragraph [ref=f27e370]: All authors are accountable for all aspects of the work, to ensure that questions related to the accuracy or integrity of any part of the work are appropriately investigated and resolved.
                  - paragraph [ref=f27e371]: Authors should appoint a single corresponding author to communicate with the journal during the editorial process. This individual submits the manuscript and all required documentation to the journal, and serves as the primary contact between the journal and the co-authors. Only the corresponding author’s affiliation will be used to determine eligibility for a publishing agreement, and possible discounts related to it. Affiliations of other co-authors are not relevant for eligibility.
              - generic [ref=f27e372]:
                - heading "Changes to authorship" [level=4] [ref=f27e373]
                - generic [ref=f27e374]:
                  - paragraph [ref=f27e375]: "The editors of this journal generally will not consider changes to authorship once a manuscript has been submitted. It is important that authors carefully consider the authorship list and order of authors and provide a definitive author list at submission. The policy of this journal around authorship changes:"
                  - list [ref=f27e376]:
                    - listitem [ref=f27e377]:
                      - paragraph [ref=f27e378]: All authors must be listed in the manuscript and their details entered into the submission system. Changes can only be made prior to acceptance, and only if approved by the journal editor. This includes additions, deletion, or rearrangement of author names.
                    - listitem [ref=f27e379]:
                      - paragraph [ref=f27e380]:
                        - text: Requests to change authorship must be made by the corresponding author using the
                        - link "Authorship Change Request form" [ref=f27e381] [cursor=pointer]:
                          - /url: https://legacyfileshare.elsevier.com/gfa/authorship-change-request-form.pdf
                        - text: . The corresponding author must provide the reason for the request to the journal editor with written confirmation from all authors, including any authors being added or removed, that they agree with the changes. Requests which do not comply with the instructions outlined in the form will not be considered.
                    - listitem [ref=f27e382]:
                      - paragraph [ref=f27e383]: This journal does not allow authorship changes after acceptance. This includes additions, deletions, or the rearrangement of author names, including changes to the corresponding author.
                    - listitem [ref=f27e384]:
                      - paragraph [ref=f27e385]: The review process may be paused while a change in authorship request is being considered.
                    - listitem [ref=f27e386]:
                      - paragraph [ref=f27e387]:
                        - text: Change requests made by the authors without the
                        - link "Authorship Change Request form" [ref=f27e388] [cursor=pointer]:
                          - /url: https://legacyfileshare.elsevier.com/gfa/authorship-change-request-form.pdf
                        - text: or editor approval may result in the rejection of the manuscript, or retraction if the article has already been published.
                  - paragraph
              - generic [ref=f27e389]:
