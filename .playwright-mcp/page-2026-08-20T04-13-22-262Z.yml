                  - paragraph [ref=f27e1059]:
                    - text: Alt text for images and captions or audio descriptions for videos may have been added to improve accessibility. These have been independently provided by Elsevier and generated with the aid of AI, please check these in your proofs. You can find more information in this
                    - link "alt text guide" [ref=f27e1060] [cursor=pointer]:
