                - heading "Data statement" [level=4] [ref=f27e786]
                - generic [ref=f27e787]:
                  - paragraph [ref=f27e788]: To foster transparency, you are required to state the availability of any data at submission.
                  - paragraph [ref=f27e789]: Ensuring data is available may be a requirement of your funding body or institution. If your data is unavailable to access or unsuitable to post, you can state the reason why (e.g., your research data includes sensitive or confidential information such as patient data) during the submission process. This statement will appear with your published article on ScienceDirect.
