                - generic [ref=f27e901]:
                  - heading "Vitae" [level=5] [ref=f27e902]
                  - paragraph [ref=f27e904]: Please submit a short (maximum 100 words) biography of each author and include a passport-type photograph as a separate figure. Please provide the biography in an editable format (e.g. Word, not in PDF format).
              - generic [ref=f27e905]:
                - heading "References" [level=4] [ref=f27e906]
                - generic [ref=f27e907]:
                  - heading "References within text" [level=5] [ref=f27e908]
                  - generic [ref=f27e909]:
                    - paragraph [ref=f27e910]: "Any references cited within your article should also be present in your reference list and vice versa. Some guidelines:"
                    - list [ref=f27e911]:
                      - listitem [ref=f27e912]:
                        - paragraph [ref=f27e913]: References cited in your abstract must be given in full.
                      - listitem [ref=f27e914]:
                        - paragraph [ref=f27e915]: We recommend that you do not include unpublished results and personal communications in your reference list, though you may mention them in the text of your article.
                      - listitem [ref=f27e916]:
                        - paragraph [ref=f27e917]: Any unpublished results and personal communications included in your reference list must follow the standard reference style of the journal. In substitution of the publication date add "unpublished results" or "personal communication."
                      - listitem [ref=f27e918]:
                        - paragraph [ref=f27e919]: References cited as "in press" imply that the item has been accepted for publication.
                    - paragraph [ref=f27e920]: Linking to cited sources will increase the discoverability of your research. We encourage the use of Digital Object Identifiers (DOIs) as reference links, as they provide a permanent link to the electronic article referenced.
                    - paragraph [ref=f27e921]: Before submission, check that all data provided in your reference list are correct, including any references which have been copied. Providing correct reference data allows us to link to abstracting and indexing services such as Scopus, Crossref and PubMed. Any incorrect surnames, journal or book titles, publication years or pagination within your references may prevent link creation.
                - generic [ref=f27e922]:
                  - heading "Reference format" [level=5] [ref=f27e923]
                  - generic [ref=f27e924]:
                    - paragraph [ref=f27e925]: "This journal does not set strict requirements on reference formatting at submission. Some guidelines:"
                    - list [ref=f27e926]:
                      - listitem [ref=f27e927]:
                        - paragraph [ref=f27e928]: References can be in any style or format as long as the style is consistent.
                      - listitem [ref=f27e929]:
                        - paragraph [ref=f27e930]: Author names, journal or book titles, chapter or article titles, year of publication, volume numbers, article numbers or pagination must be included, where applicable.
                    - paragraph [ref=f27e931]: Our journal reference style will be applied to your article after acceptance, at proof stage. If required, at this stage we will ask you to correct or supply any missing reference data.
                - generic [ref=f27e932]:
                  - heading "Reference style" [level=5] [ref=f27e933]
                  - generic [ref=f27e934]:
                    - paragraph [ref=f27e935]: Indicate references by adding a number within square brackets in the text. You can refer to author names within your text, but you must always give the reference number, e.g., "as demonstrated [3,6]. Barnaby and Jones [8] obtained a different result ....".
                    - paragraph [ref=f27e936]: Number references in the order they appear in your article.
                    - paragraph [ref=f27e937]:
                      - text: Abbreviate journal names according to the
                      - link "List of Title Word Abbreviations" [ref=f27e938] [cursor=pointer]:
                        - /url: https://portal.issn.org/ltwa
                      - text: (LTWA).
                    - paragraph [ref=f27e939]: "Examples:"
                    - heading "Reference to a journal publication:" [level=5] [ref=f27e940]
                    - paragraph [ref=f27e941]: "[1] J. van der Geer, T. Handgraaf, R.A. Lupton, The art of writing a scientific article, J. Sci. Commun. 163 (2020) 51 – 59. https://doi.org/10.1016/j.sc.2020.00372."
                    - heading "Reference to a journal publication with an article number:" [level=5] [ref=f27e942]
                    - paragraph [ref=f27e943]: "[2] J. van der Geer, T. Handgraaf, R.A. Lupton, 2022. The art of writing a scientific article. Heliyon. 19, e00205. https://doi.org/10.1016/j.heliyon.2022.e00205."
                    - heading "Reference to a book:" [level=5] [ref=f27e944]
                    - paragraph [ref=f27e945]: "[3] W. Strunk Jr., E.B. White, The Elements of Style, fourth ed., Longman, New York, 2000."
                    - heading "Reference to a chapter in a book:" [level=5] [ref=f27e946]
                    - paragraph [ref=f27e947]: "[4] G.R. Mettam, L.B. Adams, How to prepare an electronic version of your article, in: B.S. Jones, R.Z. Smith (Eds.), Introduction to the Electronic Age, E-Publishing Inc., New York, 2020, pp. 281 - 304."
                    - heading "Reference to a website:" [level=5] [ref=f27e948]
                    - paragraph [ref=f27e949]: "[5] Cancer Research UK, Cancer statistics reports for the UK. http://www.cancerresearchuk.org/aboutcancer/statistics/cancerstatsreport/, 2023 (accessed 13 March 2023)."
                    - heading "Reference to a dataset:" [level=5] [ref=f27e950]
                    - paragraph [ref=f27e951]: "[6] M. Oguro, S. Imahiro, S. Saito, T. Nakashizuka, Mortality data for Japanese oak wilt disease and surrounding forest compositions [dataset], Mendeley Data, v1, 2015. https://doi.org/10.1234/abc12nb39r.1."
                    - heading "Reference to software:" [level=5] [ref=f27e952]
                    - paragraph [ref=f27e953]: "[7] E. Coon, M. Berndt, A. Jan, D. Svyatsky, A. Atchley, E. Kikinzon, D. Harp, G. Manzini, E. Shelef, K. Lipnikov, R. Garimella, C. Xu, D. Moulton, S. Karra, S. Painter, E. Jafarov, S. Molins, Advanced Terrestrial Simulator (ATS) v0.88 [software], Zenodo, March 25, 2020. https://doi.org/10.1234/zenodo.3727209."
                - generic [ref=f27e954]:
                  - heading "Web references" [level=5] [ref=f27e955]
                  - generic [ref=f27e956]:
                    - paragraph [ref=f27e957]: When listing web references, as a minimum you should provide the full URL and the date when the reference was last accessed. Additional information (e.g. DOI, author names, dates or reference to a source publication) should also be provided, if known.
                    - paragraph [ref=f27e958]: You can list web references separately under a new heading directly after your reference list or include them in your reference list.
                - generic [ref=f27e959]:
                  - heading "Data references" [level=5] [ref=f27e960]
                  - generic [ref=f27e961]:
                    - paragraph [ref=f27e962]: We encourage you to cite underlying or relevant datasets within article text and to list data references in the reference list.
                    - paragraph [ref=f27e963]: "When citing data references, you should include:"
                    - list [ref=f27e964]:
                      - listitem [ref=f27e965]:
                        - paragraph [ref=f27e966]: author name(s)
                      - listitem [ref=f27e967]:
                        - paragraph [ref=f27e968]: dataset title
                      - listitem [ref=f27e969]:
                        - paragraph [ref=f27e970]: data repository
                      - listitem [ref=f27e971]:
                        - paragraph [ref=f27e972]: version (where available)
                      - listitem [ref=f27e973]:
                        - paragraph [ref=f27e974]: year
                      - listitem [ref=f27e975]:
                        - paragraph [ref=f27e976]: global persistent identifier
                    - paragraph [ref=f27e977]: Add [dataset] immediately before your reference. This will help us to properly identify the dataset. The [dataset] identifier will not appear in your published article.
                - generic [ref=f27e978]:
                  - heading "Preprint references" [level=5] [ref=f27e979]
                  - generic [ref=f27e980]:
                    - paragraph [ref=f27e981]: We ask you to mark preprints clearly. You should include the word "preprint" or the name of the preprint server as part of your reference and provide the preprint DOI.
                    - paragraph [ref=f27e982]: Where a preprint has subsequently become available as a peer-reviewed publication, use the formal publication as your reference.
                    - paragraph [ref=f27e983]: If there are preprints that are central to your work or that cover crucial developments in the topic, but they are not yet formally published, you may reference the preprint.
                - generic [ref=f27e984]:
                  - heading "Reference management software" [level=5] [ref=f27e985]
                  - generic [ref=f27e986]:
                    - paragraph [ref=f27e987]:
                      - text: Most journals have their reference template available in popular reference management software products. These include products that support
                      - link "Citation Style Language (CSL)" [ref=f27e988] [cursor=pointer]:
                        - /url: https://citationstyles.org/
                      - text: such as
                      - link "Mendeley Reference Manager" [ref=f27e989] [cursor=pointer]:
                        - /url: https://www.mendeley.com/reference-management/reference-manager/
                      - text: .
                    - paragraph [ref=f27e990]:
                      - text: If you use a citation plug-in from these products, select the relevant journal template and all your citations and bibliographies will automatically be formatted in the journal style. We advise you to
                      - link "remove all field codes" [ref=f27e991] [cursor=pointer]:
                        - /url: https://service.elsevier.com/app/answers/detail/a_id/26093/
                      - text: before submitting your manuscript to any reference management software product.
                    - paragraph [ref=f27e992]: If a template is not available for this journal, follow the format given in examples in the reference style section of this Guide for Authors.
            - generic [ref=f27e993]:
              - heading "Submitting your manuscript" [level=3] [ref=f27e994]
              - generic [ref=f27e995]:
                - heading "Submission checklist" [level=4] [ref=f27e996]
                - generic [ref=f27e997]:
                  - paragraph [ref=f27e998]: "Before completing the submission of your manuscript, we advise you to read our submission checklist:"
                  - list [ref=f27e999]:
                    - listitem [ref=f27e1000]:
                      - paragraph [ref=f27e1001]: One author has been designated as the corresponding author and their full contact details (email address, full postal address, and phone numbers) have been provided. Only the corresponding author’s affiliation will be used to determine eligibility for the publishing agreement.
                    - listitem [ref=f27e1002]:
                      - paragraph [ref=f27e1003]: All files have been uploaded, including artwork, videos, and supplementary materials. Don’t forget to include tables and footnotes in the files, and to submit captions.
                    - listitem [ref=f27e1004]:
                      - paragraph [ref=f27e1005]: Spelling and grammar checks have been carried out.
                    - listitem [ref=f27e1006]:
                      - paragraph [ref=f27e1007]: All references in the article text are cited in the reference list, and vice versa.
