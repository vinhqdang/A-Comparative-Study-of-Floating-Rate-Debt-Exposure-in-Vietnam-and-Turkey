              - generic [ref=f27e579]:
                - heading "Title page" [level=4] [ref=f27e580]
                - generic [ref=f27e581]:
                  - paragraph [ref=f27e582]: "You are required to include the following details in the title page information:"
                  - list [ref=f27e583]:
                    - listitem [ref=f27e584]:
                      - paragraph [ref=f27e585]: Article title. Article titles should be concise and informative. Please avoid abbreviations and formulae, where possible, unless they are established and widely understood, e.g. DNA.
                    - listitem [ref=f27e586]:
                      - paragraph [ref=f27e587]: Author names. Provide the given name(s) and family name(s) of each author. The order of authors should match the order in the submission system. Carefully check that all names are accurately spelled. If needed, you can add your name between parentheses in your own script after the English transliteration.
                    - listitem [ref=f27e588]:
                      - paragraph [ref=f27e589]: Affiliations, referring to where the work was carried out, below the author names. Indicate affiliations using a lower-case superscript letter immediately after the author's name and in front of the corresponding address. Ensure that you provide the full name and postal address of each affiliation, including the country name and, if available, the email address of each author.
                    - listitem [ref=f27e590]:
                      - paragraph [ref=f27e591]: Corresponding author. Clearly indicate who will handle correspondence for your article at all stages of the refereeing and publication process and also post-publication. This responsibility includes answering any future queries about your results, data, methodology and materials. It is important that the email address and contact details of your corresponding author are kept up to date during the submission and publication process.
                    - listitem [ref=f27e592]:
                      - paragraph [ref=f27e593]: Present/permanent address. If an author has moved since the work described in your article was carried out, or the author was visiting during that time, a "present address" (or "permanent address") can be indicated by a footnote to the author's name. The address where the author carried out the work must be retained as their main affiliation address. Use superscript Arabic numerals for such footnotes.
                  - paragraph
              - generic [ref=f27e594]:
                - heading "Double anonymized peer review" [level=4] [ref=f27e595]
                - generic [ref=f27e596]:
                  - paragraph [ref=f27e597]: This journal follows a double anonymized review process, meaning author identities are concealed from reviewers and vice versa.
                  - paragraph [ref=f27e598]: "The title page (including author details) and anonymized manuscript (excluding author details) need to be submitted as separate files. Next to the items mentioned in the title page section of this guide, the title page should also include:"
                  - list [ref=f27e599]:
                    - listitem [ref=f27e600]:
                      - paragraph [ref=f27e601]: Acknowledgements. Include any individuals who provided you with help during your research such as help with language, writing or proof reading in the acknowledgements section. Include acknowledgements only in the title page, do not add them as a footnote to your title, or anywhere else in your article.
                    - listitem [ref=f27e602]:
                      - paragraph [ref=f27e603]: Declaration of competing interests (when a separate declaration of interest file is not submitted)
                    - listitem [ref=f27e604]:
                      - paragraph [ref=f27e605]: Corresponding author address (full address is required) and email address
                  - paragraph [ref=f27e606]: The anonymized manuscript should contain the main body of your paper, including references and tables. It is important that your manuscript and any supplementary materials do not contain any identifying information such as author names or affiliations, or acknowledgements.
                  - paragraph [ref=f27e607]:
                    - text: Read more about
                    - link "peer review" [ref=f27e608] [cursor=pointer]:
                      - /url: https://www.elsevier.com/reviewer/what-is-peer-review
                    - text: .
              - generic [ref=f27e609]:
                - heading "Abstract" [level=4] [ref=f27e610]
                - generic [ref=f27e611]:
                  - paragraph [ref=f27e612]: "You are required to provide a concise and factual abstract which does not exceed 250 words. The abstract should briefly state the purpose of your research, principal results and major conclusions. Some guidelines:"
                  - list [ref=f27e613]:
                    - listitem [ref=f27e614]:
                      - paragraph [ref=f27e615]: Abstracts must be able to stand alone as abstracts are often presented separately from the article.
                    - listitem [ref=f27e616]:
                      - paragraph [ref=f27e617]: Avoid references. If any are essential to include, ensure that you cite the author(s) and year(s).
                    - listitem [ref=f27e618]:
                      - paragraph [ref=f27e619]: Avoid non-standard or uncommon abbreviations. If any are essential to include, ensure they are defined within your abstract at first mention.
                  - paragraph
              - generic [ref=f27e620]:
                - heading "Keywords" [level=4] [ref=f27e621]
                - generic [ref=f27e622]:
                  - paragraph [ref=f27e623]: You are required to provide 1 to 7 keywords for indexing purposes. Keywords should be written in English. Please try to avoid keywords consisting of multiple words (using "and" or "of").
                  - paragraph [ref=f27e624]: We recommend that you only use abbreviations in keywords if they are firmly established in the field.
              - generic [ref=f27e625]:
                - heading "Highlights" [level=4] [ref=f27e626]
                - generic [ref=f27e627]:
                  - paragraph [ref=f27e628]: You are required to provide article highlights at submission.
                  - paragraph [ref=f27e629]: "Highlights are a short collection of bullet points that should capture the novel results of your research as well as any new methods used during your study. Highlights will help increase the discoverability of your article via search engines. Some guidelines:"
                  - list [ref=f27e630]:
                    - listitem [ref=f27e631]:
                      - paragraph [ref=f27e632]: Submit highlights as a separate editable file in the online submission system with the word "highlights" included in the file name.
                    - listitem [ref=f27e633]:
                      - paragraph [ref=f27e634]: Highlights should consist of 3 to 5 bullet points, each a maximum of 85 characters, including spaces.
                  - paragraph [ref=f27e635]:
                    - text: We encourage you to view example
                    - link "article highlights" [ref=f27e636] [cursor=pointer]:
                      - /url: https://www.elsevier.com/researcher/author/tools-and-resources/highlights
                    - text: and read about the benefits of their inclusion.
              - generic [ref=f27e637]:
                - heading "Math formulae" [level=4] [ref=f27e638]
                - generic [ref=f27e639]:
                  - list [ref=f27e640]:
                    - listitem [ref=f27e641]:
                      - paragraph [ref=f27e642]: Submit math equations as editable text, not as images.
                    - listitem [ref=f27e643]:
                      - paragraph [ref=f27e644]: Present simple formulae in line with normal text, where possible.
                    - listitem [ref=f27e645]:
                      - paragraph [ref=f27e646]: Use the solidus (/) instead of a horizontal line for small fractional terms such as X/Y.
                    - listitem [ref=f27e647]:
                      - paragraph [ref=f27e648]: Present variables in italics.
                    - listitem [ref=f27e649]:
                      - paragraph [ref=f27e650]: Denote powers of e by exp.
                    - listitem [ref=f27e651]:
                      - paragraph [ref=f27e652]: Display equations separately from your text, numbering them consecutively in the order they are referred to within your text.
                  - paragraph
              - generic [ref=f27e653]:
                - heading "Tables" [level=4] [ref=f27e654]
                - generic [ref=f27e655]:
                  - paragraph [ref=f27e656]: "Tables must be submitted as editable text, not as images. Some guidelines:"
                  - list [ref=f27e657]:
                    - listitem [ref=f27e658]:
                      - paragraph [ref=f27e659]: Place tables next to the relevant text or on a separate page(s) at the end of your article.
                    - listitem [ref=f27e660]:
                      - paragraph [ref=f27e661]: Cite all tables in the manuscript text.
                    - listitem [ref=f27e662]:
                      - paragraph [ref=f27e663]: Number tables consecutively according to their appearance in the text.
                    - listitem [ref=f27e664]:
                      - paragraph [ref=f27e665]: Please provide captions along with the tables.
                    - listitem [ref=f27e666]:
                      - paragraph [ref=f27e667]: Place any table notes below the table body.
                    - listitem [ref=f27e668]:
                      - paragraph [ref=f27e669]: Avoid vertical rules and shading within table cells.
                  - paragraph [ref=f27e670]: We recommend that you use tables sparingly, ensuring that any data presented in tables is not duplicating results described elsewhere in the article.
              - generic [ref=f27e671]:
                - heading "Figures, images and artwork" [level=4] [ref=f27e672]
                - generic [ref=f27e673]:
                  - paragraph [ref=f27e674]:
                    - text: Figures, images, diagrams and other graphical media (artwork) must be supplied as separate files along with the manuscript, in line with these
                    - link "artwork and media instructions" [ref=f27e675] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/author/artwork-and-media-instructions
                    - text: ". Some excerpts:"
                  - paragraph [ref=f27e676]: "When submitting artwork:"
                  - list [ref=f27e677]:
                    - listitem [ref=f27e678]:
                      - paragraph [ref=f27e679]: Cite all images in the manuscript text.
                    - listitem [ref=f27e680]:
                      - paragraph [ref=f27e681]: Number images according to the order they appear within your article.
                    - listitem [ref=f27e682]:
                      - paragraph [ref=f27e683]: Submit each image as a separate file using a logical naming convention for your files (for example, Figure_1, Figure_2 etc).
                    - listitem [ref=f27e684]:
                      - paragraph [ref=f27e685]: Text graphics may be embedded in the text at the appropriate position. If you are working with LaTeX, text graphics may also be embedded in the file.
                  - heading "Captions" [level=4] [ref=f27e686]
                  - paragraph [ref=f27e687]: All artwork must have a caption. A caption should consist of a brief title (not displayed on the figure itself) and a description of the image. Keep the amount of text in any image to a minimum, though any symbol or abbreviation should be explained.
                  - paragraph [ref=f27e688]:
                    - text: Read how to add captions to your submission
                    - link "here" [ref=f27e689] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/author/artwork-and-media-instructions/artwork-faq
                    - text: .
                  - heading "Formats" [level=4] [ref=f27e690]
                  - paragraph [ref=f27e691]: "When your artwork is finalized, \"save as\" or convert your electronic artwork to the formats listed below taking into account the given resolution requirements for line drawings, halftones, and line/halftone combinations:"
                  - list [ref=f27e692]:
                    - listitem [ref=f27e693]:
                      - paragraph [ref=f27e694]: "Vector drawings: Save as EPS or PDF files embedding the font or saving the text as \"graphics.\""
                    - listitem [ref=f27e695]:
                      - paragraph [ref=f27e696]: "Color or grayscale photographs (halftones): Save as TIFF, JPG or PNG files using a minimum of 300 dpi (for single column width: min. 1063 pixels, full page width: 2244 pixels)."
                    - listitem [ref=f27e697]:
                      - paragraph [ref=f27e698]: "Bitmapped line drawings: Save as TIFF, JPG or PNG files, using a minimum of 1000 dpi (for single column width: min. 3543 pixels, full page width: 7480 pixels)."
                    - listitem [ref=f27e699]:
                      - paragraph [ref=f27e700]: "Combinations bitmapped line/halftones (color or grayscale): Save as TIFF, JPG or PNG files using a minimum of 500 dpi (for single column: min. 1772 pixels, full page width: 3740 pixels)."
                  - paragraph [ref=f27e701]: "Please do not submit:"
                  - list [ref=f27e702]:
                    - listitem [ref=f27e703]:
                      - paragraph [ref=f27e704]: Files that are too low in resolution.
                    - listitem [ref=f27e705]:
                      - paragraph [ref=f27e706]: Artwork where text is disproportionately small compared to the image size, as text may become unreadable.
                    - listitem [ref=f27e707]:
                      - paragraph [ref=f27e708]: Different images or graphs combined into one, as this affects accessibility
                  - heading "Color artwork" [level=4] [ref=f27e709]
                  - paragraph [ref=f27e710]: If you submit usable color figures with your accepted article, we will ensure that they appear in color online.
                  - paragraph [ref=f27e711]:
                    - text: Please ensure that color images are accessible to all, including those with impaired color vision. Learn more about
                    - link "color and web accessibility" [ref=f27e712] [cursor=pointer]:
                      - /url: https://www.w3.org/WAI/perspective-videos/contrast/
                    - text: .
              - generic [ref=f27e713]:
                - heading "Generative AI and Figures, images and other artwork" [level=4] [ref=f27e714]
                - generic [ref=f27e715]:
                  - paragraph [ref=f27e716]:
                    - text: Please read our policy on the use of generative AI and AI-assisted tools in figures, images and artwork, which can be found in Elsevier’s
                    - link "GenAI Policies for Journals" [ref=f27e717] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
                    - text: ". This policy states:"
                  - list [ref=f27e718]:
                    - listitem [ref=f27e719]:
                      - paragraph [ref=f27e720]: AI tools may be used to support the creation of explanatory images (such as flow charts, conceptual diagrams, or schematic illustrations)
                    - listitem [ref=f27e721]:
                      - paragraph [ref=f27e722]: AI tools may be used to create data visualizations (such as plots, charts, graphs, or heatmaps) when the output is directly derived from underlying data using reproducible analytical, computational, or statistical methods.
                    - listitem [ref=f27e723]:
                      - paragraph [ref=f27e724]: AI tools must not be used to create or alter images that represent primary observed or experimental data (such as western blots, microscopy images, histology images, or patient images) that were not directly obtained in the research. This includes adjustments to brightness, contrast, or color balance, which should only be done using established image processing software.
                    - listitem [ref=f27e725]:
                      - paragraph [ref=f27e726]: This policy does not prevent the use of AI tools in formal research design or research methods (such as in AI-assisted imaging approaches used for collection and/or interpretation of the underlying research data or predictive modelling of clinical outcomes based on patient data).
                  - paragraph [ref=f27e727]: Authors are responsible for ensuring the accuracy and originality of all images submitted for publication. If you used generative AI tools to create images in your manuscript, you should disclose this in each image caption as well as in the general Generative AI disclosure statement.
              - generic [ref=f27e728]:
                - heading "Supplementary material" [level=4] [ref=f27e729]
                - generic [ref=f27e730]:
                  - paragraph [ref=f27e731]: "We encourage the use of supplementary materials such as applications, images and sound clips to enhance research. Some guidelines:"
                  - list [ref=f27e732]:
                    - listitem [ref=f27e733]:
                      - paragraph [ref=f27e734]: Supplementary material should be accurate and relevant to the research.
                    - listitem [ref=f27e735]:
                      - paragraph [ref=f27e736]: Cite all supplementary files in the manuscript text.
                    - listitem [ref=f27e737]:
                      - paragraph [ref=f27e738]: Submit all supplementary materials at the same time as your manuscript.
                    - listitem [ref=f27e739]:
                      - paragraph [ref=f27e740]: Include a concise, descriptive caption for each supplementary file, describing its content.
                    - listitem [ref=f27e741]:
                      - paragraph [ref=f27e742]: After submission supplementary files can only be added or replaced in the revision stage of the editorial process.
                    - listitem [ref=f27e743]:
                      - paragraph [ref=f27e744]: Be aware that all supplementary materials provided will appear online in the exact same way as received. These files will not be checked, formatted or typeset by the production team.
                  - paragraph
              - generic [ref=f27e745]:
                - heading "Video" [level=4] [ref=f27e746]
                - generic [ref=f27e747]:
                  - paragraph [ref=f27e748]: "This journal accepts video material and animation sequences to support and enhance your scientific research. We encourage you to include links to video or animation files within articles. Some guidelines:"
