                    - /url: https://www.elsevier.com/about/policies-and-standards/publishing-ethics#4-duties-of-authors
                  - text: .
              - generic [ref=e343]:
                - heading "Declaration of interest" [level=4] [ref=e344]
                - paragraph [ref=e346]:
                  - text: "All authors must disclose any financial and personal relationships with other people or organizations that could inappropriately influence (bias) their work. Examples of potential competing interests include employment, consultancies, stock ownership, honoraria, paid expert testimony, patent applications/registrations, and grants or other funding. Authors must disclose any interests in two places: 1. A summary declaration of interest statement in the title page file (if double anonymized) or the manuscript file (if single anonymized). If there are no interests to declare then please state this: 'Declarations of interest: none'. 2. Detailed disclosures as part of a separate Declaration of Interest form, which forms part of the journal's official records. It is important for potential interests to be declared in both places and that the information matches."
                  - link "More information" [ref=e347] [cursor=pointer]:
                    - /url: https://service.elsevier.com/app/answers/detail/a_id/286/supporthub/publishing/
                  - text: .
              - generic [ref=e348]:
                - heading "Declaration of generative AI in scientific writing" [level=4] [ref=e349]
                - generic [ref=e350]:
                  - paragraph [ref=e351]: Authors must declare the use of generative AI tools in the manuscript preparation process upon submission of the paper.
                  - paragraph [ref=e352]: Generative AI and AI-assisted technologies (“AI tools”) have been rapidly adopted in research and scholarly publishing, offering significant benefits while requiring clear standards for responsible and transparent use.
                  - paragraph [ref=e353]: Authors preparing a manuscript for this journal may use AI tools to support them. However, these tools must never be used as a substitute for human critical thinking, expertise and evaluation. AI tools may only be applied with human oversight and control.
                  - paragraph [ref=e354]:
                    - text: Please read Elsevier’s detailed author policy on the use of AI tools, as stated in
                    - link "Elsevier’s generative AI policies for journals" [ref=e355] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
                    - text: .
                  - paragraph [ref=e356]: "Ultimately, authors are responsible and accountable for the contents of their work. This includes accountability for:"
                  - list [ref=e357]:
                    - listitem [ref=e358]:
                      - paragraph [ref=e359]: Carefully reviewing and verifying the accuracy, comprehensiveness, and impartiality of all AI-generated output (including checking the sources, as AI-generated references can be incorrect or fabricated).
                    - listitem [ref=e360]:
                      - paragraph [ref=e361]: Editing and adapting all material thoroughly to ensure the manuscript represents the author’s authentic and original contribution and reflects their own analysis, interpretation, insights and ideas.
                    - listitem [ref=e362]:
                      - paragraph [ref=e363]: Ensuring accuracy and originality of any AI generated images and provide appropriate attribution where relevant.
                    - listitem [ref=e364]:
                      - paragraph [ref=e365]: Ensuring the use of any tools or sources, AI-based or otherwise, is made clear and transparent to readers. If AI tools have been used, we require a disclosure statement upon submission; please see example below.
                    - listitem [ref=e366]:
                      - paragraph [ref=e367]: Ensuring the manuscript is developed in a way that safeguards data privacy, intellectual property and other rights, by checking the terms and conditions of any AI tool that is used.
                  - paragraph [ref=e368]: Finally, authors must not list or cite AI tools as an author or co-author on the manuscript since authorship implies responsibilities and tasks that can only be attributed to, and performed by, humans.
                  - paragraph [ref=e369]: "The use of AI tools in the manuscript preparation process must be declared by adding a statement at the end of the manuscript when the paper is first submitted.The statement will appear in the published work and should be placed in a new section before the references list. An example:"
                  - paragraph [ref=e370]: "Title of new section: Declaration of generative AI and AI-assisted technologies in the manuscript preparation process.Statement: During the preparation of this work the author(s) used [NAME OF TOOL / SERVICE] in order to [REASON]. After using this tool/service, the author(s) reviewed and edited the content as needed and take(s) full responsibility for the content of the published article."
                  - paragraph [ref=e371]: The declaration does not apply to the use of basic tools, such as tools used to check grammar, spelling and references. In addition, authors are not required to disclose the use of AI tools or features within specialist disability-related assistive technology, provided these are used solely for accessibility purposes.
                  - paragraph [ref=e372]: If you have nothing to disclose, you do not need to add a statement.
                  - paragraph [ref=e373]:
                    - text: "Please note: to protect authors’ rights and the confidentiality of their research, this journal does not currently allow academic editors and reviewers to upload an unpublished manuscript into a generative AI tool, as is stated in"
                    - link "Elsevier’s generative AI policies for journals" [ref=e374] [cursor=pointer]:
                      - /url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
                    - text: . However, AI tools may be used in a supportive capacity by editors and reviewers to improve structure and language of the review report or editorial decision letter or to conduct a background literature search. Elsevier is actively evaluating compliant AI tools and may revise this policy in the future.
              - generic [ref=e375]:
                - heading "Submission declaration and verification" [level=4] [ref=e376]
                - paragraph [ref=e378]:
                  - text: Submission of an article implies that the work described has not been published previously (except in the form of an abstract, a published lecture or academic thesis, see '
                  - link "Multiple, redundant or concurrent publication" [ref=e379] [cursor=pointer]:
                    - /url: https://www.elsevier.com/about/policies/publishing-ethics#Authors
                  - text: "' for more information), that it is not under consideration for publication elsewhere, that its publication is approved by all authors and tacitly or explicitly by the responsible authorities where the work was carried out, and that, if accepted, it will not be published elsewhere in the same form, in English or in any other language, including electronically without the written consent of the copyright-holder. To verify compliance, your article may be checked by"
                  - link "Crossref Similarity Check" [ref=e380] [cursor=pointer]:
                    - /url: https://www.elsevier.com/editors/perk/plagiarism-complaints/plagiarism-detection
                  - text: and other originality or duplicate checking software.
              - generic [ref=e381]:
                - heading "Use of inclusive language" [level=4] [ref=e382]
                - paragraph [ref=e384]: Inclusive language acknowledges diversity, conveys respect to all people, is sensitive to differences, and promotes equal opportunities. Content should make no assumptions about the beliefs or commitments of any reader; contain nothing which might imply that one individual is superior to another on the grounds of age, gender, race, ethnicity, culture, sexual orientation, disability or health condition; and use inclusive language throughout. Authors should ensure that writing is free from bias, stereotypes, slang, reference to dominant culture and/or cultural assumptions. We advise to seek gender neutrality by using plural nouns ("clinicians, patients/clients") as default/wherever possible to avoid using "he, she," or "he/she." We recommend avoiding the use of descriptors that refer to personal attributes such as age, gender, race, ethnicity, culture, sexual orientation, disability or health condition unless they are relevant and valid. When coding terminology is used, we recommend to avoid offensive or exclusionary terms such as "master", "slave", "blacklist" and "whitelist". We suggest using alternatives that are more appropriate and (self-) explanatory such as "primary", "secondary", "blocklist" and "allowlist". These guidelines are meant as a point of reference to help identify appropriate language but are by no means exhaustive or definitive.
              - generic [ref=e385]:
                - heading "Reporting sex- and gender-based analyses" [level=4] [ref=e386]
                - generic [ref=e387]:
                  - heading "Reporting guidance" [level=5] [ref=e388]
                  - paragraph [ref=e389]:
                    - text: For research involving or pertaining to humans, animals or eukaryotic cells, investigators should integrate sex and gender-based analyses (SGBA) into their research design according to funder/sponsor requirements and best practices within a field. Authors should address the sex and/or gender dimensions of their research in their article. In cases where they cannot, they should discuss this as a limitation to their research's generalizability. Importantly, authors should explicitly state what definitions of sex and/or gender they are applying to enhance the precision, rigor and reproducibility of their research and to avoid ambiguity or conflation of terms and the constructs to which they refer (see Definitions section below). Authors can refer to the
                    - link "Sex and Gender Equity in Research (SAGER) guidelines" [ref=e390] [cursor=pointer]:
                      - /url: https://doi.org/10.1186/s41073-016-0007-6
                    - text: and the
                    - link "SAGER guidelines checklist" [ref=e391] [cursor=pointer]:
                      - /url: https://doi.org/10.3897/ese.2022.e86910
                    - text: . These offer systematic approaches to the use and editorial review of sex and gender information in study design, data analysis, outcome reporting and research interpretation - however, please note there is no single, universally agreed-upon set of guidelines for defining sex and gender.
                  - heading "Definitions" [level=5] [ref=e392]
                  - paragraph [ref=e393]:
                    - text: Sex generally refers to a set of biological attributes that are associated with physical and physiological features (e.g., chromosomal genotype, hormonal levels, internal and external anatomy). A binary sex categorization (male/female) is usually designated at birth ("sex assigned at birth"), most often based solely on the visible external anatomy of a newborn. Gender generally refers to socially constructed roles, behaviors, and identities of women, men and gender-diverse people that occur in a historical and cultural context and may vary across societies and over time. Gender influences how people view themselves and each other, how they behave and interact and how power is distributed in society. Sex and gender are often incorrectly portrayed as binary (female/male or woman/man) and unchanging whereas these constructs actually exist along a spectrum and include additional sex categorizations and gender identities such as people who are intersex/have differences of sex development (DSD) or identify as non-binary. Moreover, the terms "sex" and "gender" can be ambiguous--thus it is important for authors to define the manner in which they are used. In addition to this definition guidance and the SAGER guidelines, the
                    - link "resources on this page" [ref=e394] [cursor=pointer]:
                      - /url: https://www.elsevier.com/researcher/author/policies-and-guidelines/edi#2-best-practice
                    - text: offer further insight around sex and gender in research studies.
              - generic [ref=e395]:
                - heading "Changes to authorship" [level=4] [ref=e396]
                - generic [ref=e397]:
                  - paragraph [ref=e398]: "Authors are expected to consider carefully the list and order of authors before submitting their manuscript and provide the definitive list of authors at the time of the original submission. Any addition, deletion or rearrangement of author names in the authorship list should be made only before the manuscript has been accepted and only if approved by the journal Editor. To request such a change, the Editor must receive the following from the corresponding author: (a) the reason for the change in author list and (b) written confirmation (e-mail, letter) from all authors that they agree with the addition, removal or rearrangement. In the case of addition or removal of authors, this includes confirmation from the author being added or removed."
                  - paragraph [ref=e399]: Only in exceptional circumstances will the Editor consider the addition, deletion or rearrangement of authors after the manuscript has been accepted. While the Editor considers the request, publication of the manuscript will be suspended. If the manuscript has already been published in an online issue, any requests approved by the Editor will result in a corrigendum.
