            - generic [ref=e690]:
              - heading "After acceptance" [level=3] [ref=e691]
              - generic [ref=e692]:
                - heading "Proofs" [level=4] [ref=e693]
                - generic [ref=e694]:
                  - paragraph [ref=e695]:
                    - text: One set of page proofs (as PDF files) will be sent by e-mail to the corresponding author (if we do not have an e-mail address then paper proofs will be sent by post) or a link will be provided in the e-mail so that authors can download the files themselves. To ensure a fast publication process of the article, we kindly ask authors to provide us with their proof corrections within two days. Elsevier now provides authors with PDF proofs which can be annotated; for this you will need to
                    - link "download the free Adobe Reader" [ref=e696] [cursor=pointer]:
                      - /url: https://get.adobe.com/reader
                    - text: ", version 9 (or higher). Instructions on how to annotate PDF files will accompany the proofs (also given online). The exact system requirements are given at the"
                    - link "Adobe site" [ref=e697] [cursor=pointer]:
                      - /url: https://helpx.adobe.com/reader/system-requirements.html
                    - text: .
                  - paragraph [ref=e698]: "If you do not wish to use the PDF annotations function, you may list the corrections (including replies to the Query Form) and return them to Elsevier in an e-mail. Please list your corrections quoting line number. If, for any reason, this is not possible, then mark the corrections and any other comments (including replies to the Query Form) on a printout of your proof and scan the pages and return via e-mail. Please use this proof only for checking the typesetting, editing, completeness and correctness of the text, tables and figures. Significant changes to the article as accepted for publication will only be considered at this stage with permission from the Editor. We will do everything possible to get your article published quickly and accurately. It is important to ensure that all corrections are sent back to us in one communication: please check carefully before replying, as inclusion of any subsequent corrections cannot be guaranteed. Proofreading is solely your responsibility."
