                - heading "Reference management software" [level=4] [ref=e656]
                - paragraph [ref=e658]:
                  - text: Most Elsevier journals have their reference template available in many of the most popular reference management software products. These include all products that support
                  - link "Citation Style Language styles" [ref=e659] [cursor=pointer]:
                    - /url: https://citationstyles.org
                  - text: ", such as"
                  - link "Mendeley" [ref=e660] [cursor=pointer]:
                    - /url: https://www.mendeley.com/reference-management/reference-manager/
                  - text: . Using citation plug-ins from these products, authors only need to select the appropriate journal template when preparing their article, after which citations and bibliographies will be automatically formatted in the journal's style. If no template is yet available for this journal, please follow the format of the sample references and citations as shown in this Guide. If you use reference management software, please ensure that you remove all field codes before submitting the electronic manuscript.
                  - link "More information on how to remove field codes from different reference management software" [ref=e661] [cursor=pointer]:
                    - /url: https://service.elsevier.com/app/answers/detail/a_id/26093/
                  - text: .
              - generic [ref=e662]:
                - heading "Reference style" [level=4] [ref=e663]
                - generic [ref=e664]:
                  - paragraph [ref=e665]:
                    - text: "Text: Citations in the text should follow the referencing style used by the American Psychological Association. You are referred to the Publication Manual of the American Psychological Association, Seventh Edition, ISBN 978-1-4338-3215-4, copies of which may be"
                    - link "ordered online" [ref=e666] [cursor=pointer]:
                      - /url: https://apastyle.apa.org/products/publication-manual-7th-edition
                    - text: .
                  - paragraph [ref=e667]: "List: references should be arranged first alphabetically and then further sorted chronologically if necessary. More than one reference from the same author(s) in the same year must be identified by the letters 'a', 'b', 'c', etc., placed after the year of publication."
                  - paragraph [ref=e668]: "Examples:"
