                - heading "Material and methods" [level=4] [ref=e492]
                - paragraph [ref=e494]: Provide sufficient details to allow the work to be reproduced by an independent researcher. Methods that are already published should be summarized, and indicated by a reference. If quoting directly from a previously published method, use quotation marks and also cite the source. Any modifications to existing methods should also be described.
