              - heading "Introduction" [level=3] [ref=f13e208]
              - generic [ref=f13e210]:
                - paragraph [ref=f13e211]: "Journal of International Financial Markets, Institutions & Money offers authors two choices to publish their research:"
                - table [ref=f13e212]:
                  - rowgroup [ref=f13e213]:
                    - row [ref=f13e214]:
                      - columnheader [ref=f13e215]:
                        - paragraph [ref=f13e216]: Open access
                      - columnheader [ref=f13e217]:
                        - paragraph [ref=f13e218]: Subscription
                    - row [ref=f13e219]:
                      - cell [ref=f13e220]:
                        - paragraph [ref=f13e221]: Also called gold open access. Articles are freely available to both subscribers and the wider public with permitted reuse.
                      - cell [ref=f13e222]:
                        - paragraph [ref=f13e223]:
                          - text: Articles are made available to subscribers as well as developing countries and patient groups through our
                          - link "access programs" [ref=f13e224] [cursor=pointer]:
                            - /url: https://www.elsevier.com/open-science/science-and-society
                          - text: .
                    - row [ref=f13e225]:
                      - cell [ref=f13e226]:
                        - paragraph [ref=f13e227]: An open access publication fee is payable by authors, or their institution or funder.
                      - cell [ref=f13e228]:
                        - paragraph [ref=f13e229]: No open access publication fee.
                - paragraph [ref=f13e230]:
                  - text: In accordance with funding body requirements, Elsevier offers alternative open access publishing options. Visit our
                  - link "open access page" [ref=f13e231] [cursor=pointer]:
                    - /url: https://www.elsevier.com/open-access
                  - text: for full information.
                - paragraph [ref=f13e232]: Your publication choice will have no effect on the peer review process or acceptance of your submission.
            - generic [ref=f13e233]:
              - heading "Open Access Licences" [level=3] [ref=f13e234]
              - generic [ref=f13e235]:
                - heading "User rights" [level=4] [ref=f13e236]
                - paragraph [ref=f13e238]:
                  - text: All articles published open access will be immediately and permanently free for everyone to read and download, copy and distribute. We offer authors a choice of
                  - link "user licenses" [ref=f13e239] [cursor=pointer]:
                    - /url: https://www.elsevier.com/about/policies/open-access-licenses
                  - text: ", which define the permitted reuse of articles. We currently offer the following license(s) for this journal:"
              - generic [ref=f13e240]:
                - heading "Creative Commons Attribution (CC BY)" [level=4] [ref=f13e241]
                - paragraph [ref=f13e243]: "Allows users to: distribute and copy the article; create extracts, abstracts, and other revised versions, adaptations or derivative works of or from an article (such as a translation); include in a collective work (such as an anthology); and text or data mine the article. These uses are permitted even for commercial purposes, provided the user: gives appropriate credit to the author(s) (with a link to the formal publication through the relevant DOI); includes a link to the license; indicates if changes were made; and does not represent the author(s) as endorsing the adaptation of the article or modify the article in such a way as to damage the authors' honor or reputation."
              - generic [ref=f13e244]:
                - heading "Creative Commons Attribution-NonCommercial (CC BY-NC)" [level=4] [ref=f13e245]
                - paragraph [ref=f13e247]: "Allows users to: distribute and copy the article; create extracts, abstracts, and other revised versions, adaptations or derivative works of or from an article (such as a translation); include in a collective work (such as an anthology); and text or data mine the article. These uses are permitted only for non-commercial purposes, and provided the user: gives appropriate credit to the author(s) (with a link to the formal publication through the relevant DOI); includes a link to the license; indicates if changes were made; and does not represent the author(s) as endorsing the adaptation of the article or modify the article in such a way as to damage the authors' honor or reputation."
              - generic [ref=f13e248]:
                - heading "Creative Commons Attribution-NonCommercial-NoDerivs (CC BY-NC-ND)" [level=4] [ref=f13e249]
                - generic [ref=f13e250]:
                  - paragraph [ref=f13e251]: "Allows users to: distribute and copy the article; and include in a collective work (such as an anthology). These uses are permitted only for non-commercial purposes, and provided the user: gives appropriate credit to the author(s) (with a link to the formal publication through the relevant DOI); provides a link to the license; and does not alter or modify the article."
                  - paragraph [ref=f13e252]: If you need to comply with your funding body policy you can apply for a CC BY license after your manuscript is accepted for publication.
