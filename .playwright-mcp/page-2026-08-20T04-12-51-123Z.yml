                  - text: and grant public access via their institution’s repository after an embargo period. For subscription articles, an embargo period helps journals deliver value to subscribers before a manuscript becomes freely accessible. The embargo period begins from the date the article is formally published online in its final and fully citable form. This journal has an embargo period of 24 months for self-archiving. The
