  - generic [ref=e1271]:
    - paragraph [ref=e1272]: BIST piyasalarında oluşan tüm verilere ait telif hakları tamamen BIST'e ait olup, bu veriler tekrar yayınlanamaz. Pay Piyasası, Borçlanma Araçları Piyasası, Vadeli İşlem ve Opsiyon Piyasası verileri BIST kaynaklı en az 15 dakika gecikmeli verilerdir.
    - paragraph [ref=e1273]: "SPK'nın 22 Nisan 2002 tarihli Resmi Gazete'de yayımlanan tebliği uyarınca yayımlanması istenen uyarı:"
    - paragraph [ref=e1274]: "\"Burada yer alan yatırım bilgi, yorum ve tavsiyeleri yatırım danışmanlığı kapsamında değildir. Yatırım danışmanlığı hizmeti, aracı kurumlar, portföy yönetim şirketleri, mevduat kabul etmeyen bankalar ile müşteri arasında imzalanacak yatırım danışmanlığı sözleşmesi çerçevesinde sunulmaktadır. Burada yer alan yorum ve tavsiyeler, yorum ve tavsiyede bulunanların kişisel görüşlerine dayanmaktadır. Bu görüşler, mali durumunuz ile risk ve getiri tercihlerinize uygun olmayabilir. Bu nedenle, sadece burada yer alan bilgilere dayanılarak yatırım kararı verilmesi, beklentilerinize uygun sonuçlar doğurmayabilir.\""
    - paragraph [ref=e1275]: Finansal veriler Forinvest A.Ş. tarafından sağlanmaktadır.
    - paragraph [ref=e1276]: Mynet, yayınlanan verilerin doğruluğu ve tamlığı konusunda herhangi bir garanti vermez. Veri yayınında oluşabilecek aksaklıklardan, verinin eksik ve yanlış yayınlanmasından meydana gelebilecek herhangi bir zarardan Mynet sorumlu değildir.
